name: Little Orbit
on:
  push:
    paths: ['tools/little-orbit/**', '.github/workflows/little-orbit.yml']
  pull_request:
    paths: ['tools/little-orbit/**', '.github/workflows/little-orbit.yml']
permissions:
  contents: read
jobs:
  browser-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/little-orbit
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/little-orbit/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Run npm test
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          npm test > test-results/ci-run.log 2>&1
          clock_test_status=$?
          cat test-results/ci-run.log
          if [ "$clock_test_status" -ne 0 ]; then
            node <<'NODE'
          const fs = require('node:fs');
          const log = fs.readFileSync('test-results/ci-run.log', 'utf8');
          const start = log.search(/AssertionError|(?:^|\n)[A-Za-z]*Error:/m);
          // Keep below GitHub's annotation limit so unknown failures retain their tail.
          const excerpt = start < 0 ? log.slice(-3000) : log.slice(start, start + 3000);
          const escaped = excerpt.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          console.log('::error title=Clock regression failure::' + escaped);
          NODE
          fi
          exit "$clock_test_status"
      - name: Portable build must be current
        run: git diff --exit-code -- 'Little Orbit.html'
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: little-orbit-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            tools/little-orbit/test-results/ci-run.log
            tools/little-orbit/test-results/clock-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 7
