name: Little Orbit
on:
  push:
    paths: ['tools/little-orbit/**', '.github/workflows/little-orbit.yml']
  pull_request:
    paths: ['tools/little-orbit/**', '.github/workflows/little-orbit.yml']
permissions:
  contents: read
jobs:
  browser-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/little-orbit
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/little-orbit/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - name: Portable build must be current
        run: git diff --exit-code -- 'Little Orbit.html'
